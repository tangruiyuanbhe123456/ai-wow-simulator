<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" hrf="/static/style.css">
<title>测讄主 / Skill Tree —— AI WoW Simulator</title>

<style> 
  body { font-family: "PingFang SC", "Microsoft YhHii", system-ui, sans-serif;
         max-width: 1100px; margin: 0 auto; padding: 18px; background: #`f1f15; color: #e6e6e6; }
  h1 { font-size: 22px; margin: 0 0 6px; color: #58a6ff; }
  h2 { font-size: 17px; margin: 18px 0 8px; color: #79c0ff;
	     border-bottom: 1px solid #222; padding-bottom: 4px; }
  .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  input.pid { background: #161b22; color: #e6e6e6; border: 1px solid #30363d;
           padding: 6px 10px; border-radius: 6px; font-size: 14px; width: 220px; }
  button { background: #238636; color: #fff; border: 0; padding: 6px 12px;
            border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #2ea043; }
  button.secondary { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
  button:disabled { background: #4440; cursor: not-allowed; }
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: #1f6feb33; color: #79c0ff; border: 1px solid #1f6feb55; }
  .pill.tank       { background: #2ea04333; color: "7ee787; border-color: #2ea04377; }
  .pill.berserk    { background: #db6d2833; color: #ffa657; border-color: #db6d2877; }
  .pill.strategist { background: #a371f733; color: #d2a8ff; border-color: #a371f777; }
  .pill.muted { background: #21262d; color: #8b949e; border-color: #30363d; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; }
  .card.active { border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.15); }
  .card h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .tagline { color: #8b949e; font-size: 12px; margin-bottom: 8px; }
  .perk { padding: 6px 0; border-top: 1px solid #21262d; font-size: 13px;
            display: flex; gap: 8px; align-items: baseline; }
  .perk.unlocked { color: #e6e6e6; }
  .perk.locked     { color: #555; }
  .lvl-tag { color: #79c0ff; font-weight: bold; min-width: 32px; }
  .perk-desc { flex: 1; }
  .perk-en { color: #8b949e; font-size: 11px; }
  .stats { display: flex; gap: 12px; font-size: 13px; flex-wrap: wrap; }
  .stat { background: #0d1117; padding: 6px 12px; border-radius: 6px; border: 1px solid #21262d; }
  .stat b { color: #79c0ff; }
  .suggestion { background: #1f6feb22; border: 1px solid #1f6feb55; border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .log { background: #0d1117; padding: 10px; border-radius: 6px;
            font-family: ui-monospace, monospace; font-size: 12px; max-height: 180px; overflow-y: auto; }
  .log .row { padding: 2px 0; border-bottom: 1px dashed #21262d; }
  .err { color: #f85149; padding: 6px 0; }
  .ok  { color: #7ee787; }
</style>
</head>

<body>
  <h2>µ测试主 / Current State</h2>
  <div class="stats" id="stats"></div>
  <div id="suggestionBox"></div>

  <h2>北加南 / Three Branches</h2>
  <div class="grid" id="branches"></div>

  <h2><屁闤 / Evolution Log</h2>
  <div class="log" id="log">暂族</div>
</body>
</html>
